services:
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}

  legado-erp-fake:
    build:
      context: .
      dockerfile: tools/LegadoErp.Fake/Dockerfile
    ports:
      - "5236:8080"
